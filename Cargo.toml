[package]
name = "relay-pp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A streaming server on media-pp: RTSP cameras pulled, played over RTSP and WebRTC, recorded."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hash1018/relay-pp"
publish = false

[dependencies]
# The server parts relay-pp is built on are not in a media-pp release yet,
# so it is taken from the repository at a revision. To build against a
# checkout beside this one instead:
#   cargo build --config 'patch."https://github.com/hash1018/media-pp".media-pp.path="../media-pp/lib"'
media-pp = { git = "https://github.com/hash1018/media-pp", rev = "570a899273c596e993fb43f7ebcf734fb9a476a9", features = ["rtsp-server", "rtmp-server", "webrtc"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
futures = "0.3"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "1"
tracing = "0.1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pictures are converted on the GPU where one takes them: D3D11 on Windows
# (NVENC, or Media Foundation's Intel and AMD encoders), NVIDIA's NVDEC and
# NVENC or else Vulkan Video on Linux, VideoToolbox on macOS. None needs an
# SDK to build, and a machine without the GPU converts in software.
[target.'cfg(windows)'.dependencies]
media-pp = { git = "https://github.com/hash1018/media-pp", rev = "570a899273c596e993fb43f7ebcf734fb9a476a9", features = ["d3d11"] }

[target.'cfg(target_os = "linux")'.dependencies]
media-pp = { git = "https://github.com/hash1018/media-pp", rev = "570a899273c596e993fb43f7ebcf734fb9a476a9", features = ["cuda", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
media-pp = { git = "https://github.com/hash1018/media-pp", rev = "570a899273c596e993fb43f7ebcf734fb9a476a9", features = ["videotoolbox"] }
