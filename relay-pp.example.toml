# relay-pp's configuration: copy to relay-pp.toml beside the program, or
# name the file on the command line (`relay-pp path/to/file.toml`).
# Every section is optional; what is shown below is the default where a
# value is commented out. Channels are not here: they are made over the API.

[rtsp]
# Where RTSP players connect.
# listen = "0.0.0.0:8554"
# Whether players may ask for RTP over UDP as well as over their connection.
# udp = true
# What the URL POST /api/v1/channels/<name>/play answers with begins with,
# where players reach this machine by another address than the API's
# callers — behind a router, say. Without it: the host the request came to,
# and `listen`'s port.
# public_url = "rtsp://cctv.example.com:8554"

[webrtc]
# The UDP address WebRTC media goes through.
# listen = "0.0.0.0:8189"
# The addresses players are told to send to, where `listen` is every
# interface or the machine is behind a router: an IP alone keeps the port.
candidates = ["192.168.0.10"]
# How many threads sessions are spread over, each a UDP port of its own
# from `listen`'s on.
# threads = 2

[http]
# The API, WHEP for browsers (POST /<name>/whep) and recordings.
# listen = "0.0.0.0:8888"

[rtmp]
# Where RTMP publishers — OBS, encoders — connect, to a channel made with
# "publish": "rtmp": rtmp://<host>:1935/live/<channel>.
# listen = "0.0.0.0:1935"

[record]
# Where recordings go: <dir>/<name>/<YYYY-MM-DD>/<HH-MM-SS>/, in UTC, each an
# HLS playlist and one media file.
# dir = "recordings"
# How long a segment is — what a player seeks to — cut at the next keyframe.
# segment = "4s"
# How long one recording directory runs, at whole multiples of it in UTC.
# chunk = "1h"
# How long a recording is kept from its last write, and how much all of them
# may take, the oldest removed first. Kept for ever where neither is set.
# keep = "30d"
# max_size = "500GB"

[convert]
# What is converted for a way out that cannot carry what a camera sends —
# WebRTC players, a recording — where a channel says nothing of it; a
# channel's own "convert" in POST /api/v1/channels comes first.
# Sound: "auto", converted on the processor (to Opus for WebRTC, AAC for a
# recording); or "off", left out of that way out.
# sound = "auto"
# Pictures: "gpu", converted to H.264 where a GPU encoder takes them and
# refused where none does; "any", on the processor where no GPU does; or
# "off", that way out refused.
# video = "gpu"

# [auth]
# Without this section, anybody who reaches a port may do anything.
# What the manager presents for /api/v1, as "Authorization: Bearer <token>".
# api_token = "a long random string"
# What play tokens — HS256 JSON Web Tokens the manager signs, with "exp" and
# the channels they let their holder "play" and watch the "recordings" of —
# are signed with: 32 characters or more.
# token_secret = "another long random string, 32 or more"

# Players by name and password: RTSP's Digest or Basic, HTTP's Basic.
# [[auth.users]]
# name = "operator"
# password = "..."
# play = ["*"]
# recordings = ["floor2-*"]
# publish = ["studio"]
